execution_plan:
  maximum_time: 60
  setup:
    script: /toexfi/bug_exploration/redis/setup/start_cluster.sh
    duration: 10
  workload:
    script: /toexfi/bug_exploration/redis/setup/start_workload_elle.sh
  cleanup:
    script: /toexfi/bug_exploration/redis/setup/cleanup.sh
  # pre_workload:
  #   script: /toexfi/bug_exploration/redis/setup/init_cluster.sh
  tracer:
    #functions_file: /vagrant/profiler/redis/functions.txt
    tracer_location: "/vagrant/tracer/target/release/tracer"
    pipe_location: "/tmp/containerpid"
    binary_to_examine: "/usr/local/bin/redis-server"
    tracing_type: sys_all_trace,container_controlled
nodes:
  node1:
    container: true
    script: /scripts/start_redis.sh
    binary: /usr/local/bin/redis-server
    ip: 172.38.0.11
  node2:
    container: true
    script: /scripts/start_redis.sh
    binary: /usr/local/bin/redis-server
    ip: 172.38.0.12
  node3:
    container: true
    script: /scripts/start_redis.sh
    binary: /usr/local/bin/redis-server
    ip: 172.38.0.13
  node4:
    container: true
    script: /scripts/start_redis.sh
    binary: /usr/local/bin/redis-server
    ip: 172.38.0.14
  node5:
    container: true
    script: /scripts/start_redis.sh
    binary: /usr/local/bin/redis-server
    ip: 172.38.0.15
  node6:
    container: true
    script: /scripts/start_redis.sh
    binary: /usr/local/bin/redis-server
    ip: 172.38.0.16

faults:
  fault_a:
    type: process_pause
    target: node1
    traced: node1
    duration: 5000
    begin_conditions:
      - dep:
          type: time
          time: 5000

  fault_b:
    type: process_kill
    target: node2
    traced: node2
    begin_conditions:
      - dep:
          type: fault_condition
          name: fault_a

  fault_c:
    type: process_kill
    target: node3
    traced: node3
    occurrences: 1
    begin_conditions:
      - dep:
          type: fault_condition
          name: fault_b
      - dep2:
          type: time
          time: 20000

  fault_d:
    type: syscall
    details:
      name: write
      return_value: -5
    target: node2
    traced: node2
    occurrences: 1
    begin_conditions:
      - dep:
          type: fault_condition
          name: fault_c
