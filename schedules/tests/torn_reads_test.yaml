execution_plan:
  maximum_time: 60
  setup:
    script: /vagrant/schedules/tests/test_programs/build.sh
  cleanup:
    duration: 5
  tracer:
    tracer_location: /vagrant/tracer/target/release/tracer
    pipe_location: /tmp/containerpid
    tracing_type: production_trace,process_controlled

nodes:
  reader:
    container: false
    script: /vagrant/schedules/tests/test_programs/partial_read_demo

faults:
  # Lets reader's real read() complete in full (still reports 64/64 bytes
  # read - a genuine success), then silently poisons buf[offset:64) with
  # 0xEE via rose.ko's torn_read_krp kretprobe (see rose.c's
  # torn_read_ret_handler) - the read()-side mirror of a real disk failure:
  # data silently wrong despite the syscall reporting full success, as
  # opposed to PARTIAL_READ_FAULT's (partial_reads_test.yaml) truncated
  # count. This needs a kretprobe rather than a pre_handler because the real
  # data has to actually land in the buffer before there's anything
  # meaningful to corrupt.
  #
  # See partial_writes_test.yaml for the full rationale behind using a
  # user_function uprobe (arms rose.ko synchronously, in-kernel, via a kfunc
  # call from state_processor.bpf.h's inject_fault() - no timing-race
  # workaround needed).
  #
  # symbol/offset (of the *uprobe*, not to be confused with the fault's own
  # `offset` detail below) point at the *exact instruction* of the real
  # target read() call: `objdump -dl -M intel partial_read_demo
  # --disassemble=main` on the compiled binary shows main at file offset
  # 0x1229 and its `call read@plt` at 0x1396, so uprobe offset: 365 (0x16d)
  # lands the probe precisely there.
  #
  # CAUTION: this offset is tied to exactly how gcc -O0 laid out main()'s
  # stack frame when this was computed (on this dev host, not necessarily the
  # target VM) - ANY edit to partial_read_demo.c can shift it, regardless of
  # where in the file the edit is (see partial_writes_test.yaml's longer
  # explanation of why). Re-run the objdump command above against the binary
  # actually built by setup.script on the VM you're testing on and update
  # this offset before trusting it.
  torn_read:
    type: torn_read
    target: reader
    traced: reader
    details:
      # Offset within the read()'s *actually returned* bytes to start
      # poisoning with 0xEE from - not the uprobe's own offset above.
      offset: 16
    begin_conditions:
      - condition1:
          type: user_function
          binary_location: /vagrant/schedules/tests/test_programs/partial_read_demo
          symbol: main
          offset: 365
          absolute_offset: false
          call_count: 1
