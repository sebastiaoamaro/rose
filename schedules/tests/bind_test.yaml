faults:
  # Exercises get_fault_type_nr()/check_if_syscall_supported() (faults.py):
  # inject a bind() failure directly on a time trigger.
  fault_a:
    type: syscall
    details:
      name: bind
      return_value: -13   # -EACCES
    target: node1
    traced: node1
    occurrences: 5
    begin_conditions:
      - condition0:
          type: time
          time: 100

  # Exercises get_cond_type_nr() (conditions.py): only fires once node2 has
  # made 3 bind() calls, instead of on a timer.
  fault_b:
    type: syscall
    details:
      name: bind
      return_value: -13   # -EACCES
    target: node2
    traced: node2
    occurrences: 5
    begin_conditions:
      - condition0:
          type: syscall
          syscall_name: bind
          call_count: 3
